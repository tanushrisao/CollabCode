<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | COLLABCODE</title>
  <meta name="description" content="Oops! The page you were looking for doesn't exist. Let's get you back to writing awesome code on COLLABCODE.">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Dynamic Navbar Injected Here -->
  <div id="navbar-container"></div>

  <!-- Main Error Portal -->
  <main class="error-container">
    <!-- Ambient back glow sphere -->
    <div class="hero-glow-sphere" style="top: 30%; width: 400px; height: 400px;"></div>

    <section class="glass-panel" style="max-width: 580px; padding: 3.5rem 2.5rem; border-color: rgba(255, 23, 68, 0.15); box-shadow: 0 0 25px rgba(255, 23, 68, 0.08);">
      <h1 class="error-code" style="background: linear-gradient(135deg, var(--accent-red) 0%, #ff5252 100%); -webkit-background-clip: text; filter: drop-shadow(0 0 20px rgba(255, 23, 68, 0.2));">
        404
      </h1>
      <h2 class="error-title">Compilation Error</h2>
      <p class="error-description">
        The workspace room you're looking for doesn't exist, has been deleted, or is currently compiling in a parallel universe.
      </p>

      <!-- Return CTA Button -->
      <a href="./index.html" class="btn btn-primary" style="padding: 0.8rem 2rem; font-size: 1.05rem;">
        Go Home
      </a>
    </section>
  </main>

  <!-- Shared & Page Logic -->
  <script src="./js/main.js"></script>
</body>
</html>
