<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticate | COLLABCODE Workspace</title>
  <meta name="description" content="Securely access your saved real-time collaborative coding workspaces and synchronize documents on COLLABCODE.">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- Dynamic Navbar Injected Here -->
  <div id="navbar-container"></div>

  <!-- Main Authenticate Portal -->
  <main class="auth-wrapper">
    <!-- Ambient back glow sphere -->
    <div class="hero-glow-sphere" style="top: 25%; width: 350px; height: 350px;"></div>

    <section class="auth-card glass-panel" id="auth-panel-card">
      <div class="auth-header">
        <h1 class="auth-title text-gradient" id="auth-card-title">Welcome Back</h1>
        <p class="auth-subtitle" id="auth-card-subtitle">Sign in to access your saved collaborative workspaces</p>
      </div>

      <!-- Sign In vs. Sign Up Tab Selector -->
      <div class="auth-tabs" id="auth-tab-selector">
        <button type="button" class="auth-tab active" id="tab-login">Sign In</button>
        <button type="button" class="auth-tab" id="tab-signup">Sign Up</button>
      </div>

      <!-- Form Inputs Container -->
      <form id="auth-form" autocomplete="off">
        
        <!-- Username input -->
        <div class="form-group" id="group-username">
          <label for="input-username" class="form-label">Username</label>
          <input 
            type="text" 
            id="input-username" 
            class="form-control" 
            placeholder="e.g. hackerman" 
            required 
            minlength="3" 
            maxlength="20"
          >
        </div>

        <!-- Optional Email input (Signup only) -->
        <div class="form-group" id="group-email" style="display: none;">
          <label for="input-email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="input-email" 
            class="form-control" 
            placeholder="e.g. dev@collabcode.com"
          >
        </div>

        <!-- Password input -->
        <div class="form-group" id="group-password">
          <label for="input-password" class="form-label">Password</label>
          <input 
            type="password" 
            id="input-password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            minlength="6"
          >
        </div>

        <!-- Primary Action Button -->
        <button type="submit" class="btn btn-primary" id="btn-submit" style="width: 100%; padding: 0.8rem; font-size: 1.05rem; margin-top: 1rem;">
          Sign In
        </button>

      </form>
      
      <p class="auth-footer-text">
        🔒 Encrypted connection. Passwords are fully hashed.
      </p>
    </section>
  </main>

  <!-- Central Dynamic Toast Notifications -->
  <div id="app-toast" class="toast"></div>

  <!-- Shared & Page Logic -->
  <script src="./js/main.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
